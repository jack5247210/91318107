<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詩的賞析1 - 李白《將進酒》</title>
    <style>
        /* 1. 整頁背景設為粉紅色 */
        body {
            background-color: pink;
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        /* 2. 詩的標題：藍色、40點字 */
        h1 {
            color: blue;
            font-size: 40pt;
            margin-bottom: 10px;
        }

        .author {
            color: #333;
            font-size: 20pt;
            margin-bottom: 25px;
        }

        /* 3. 李白畫像：置中、寬300px、深紫色5px框線、圓角半徑50px */
        .portrait {
            display: block;
            margin: 0 auto 30px auto;
            width: 300px;
            height: auto;
            border: 5px solid #4B0082;
            border-radius: 50px;
        }

        /* 2. 詩的內容：綠色、30點字 */
        .poem-content {
            color: green;
            font-size: 30pt;
            line-height: 1.8;
        }

        .poem-content p {
            margin: 8px 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 36px;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 14pt;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>將進酒</h1>
    <div class="author">唐・李白</div>

    <!-- 對應資料夾中的 LiBai.jpg -->
    <img src="LiBai.jpg" alt="唐代詩人李白畫像" class="portrait">

    <div class="poem-content">
        <p>君不見黃河之水天上來，奔流到海不復回。</p>
        <p>君不見高堂明鏡悲白髮，朝如青絲暮成雪。</p>
        <p>人生得意須盡歡，莫使金樽空對月。</p>
        <p>天生我材必有用，千金散盡還復來。</p>
        <p>烹羊宰牛且為樂，會須一飲三百杯。</p>
        <p>岑夫子，丹丘生，將進酒，杯莫停。</p>
        <p>與君歌一曲，請君為我傾耳聽。</p>
        <p>鐘鼓饌玉不足貴，但願長醉不願醒。</p>
        <p>古來聖賢皆寂寞，惟有飲者留其名。</p>
        <p>陳王昔時宴平樂，斗酒十千恣歡謔。</p>
        <p>主人何為言少錢，徑須沽取對君酌。</p>
        <p>五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。</p>
    </div>
