<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詩的賞析2 - 劉禹錫《烏衣巷》</title>
    <style>
        /* 1. 整頁背景設為粉黃色 */
        body {
            background-color: #FFFFE0;
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        /* 2. 詩的標題：紅色、36點字 */
        h1 {
            color: red;
            font-size: 36pt;
            margin-bottom: 10px;
        }

        .author {
            color: #555;
            font-size: 18pt;
            margin-bottom: 25px;
        }

        /* 3. 劉禹錫畫像：頁面中央、寬200px、深棕色3px框線、四周圓角半徑20px */
        .portrait {
            display: block;
            margin: 0 auto 30px auto;
            width: 200px;
            height: auto;
            border: 3px solid #4A2511;
            border-radius: 20px;
        }

        /* 2. 詩的內容：棕色、24點字 */
        .poem-content {
            color: brown;
            font-size: 24pt;
            line-height: 1.8;
        }

        .poem-content p {
            margin: 8px 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 36px;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 14pt;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>烏衣巷</h1>
    <div class="author">唐・劉禹錫</div>

    <!-- 對應資料夾中的 images.jpg -->
    <img src="images.jpg" alt="唐代詩人劉禹錫畫像" class="portrait">

    <div class="poem-content">
        <p>朱雀橋邊野草花，烏衣巷口夕陽斜。</p>
        <p>舊時王謝堂前燕，飛入尋常百姓家。</p>
    </div>

    <!-- 返回 index2.html -->
    <a href="index.html" class="back-link">← 返回周黃證暐的個人網頁</a>

</body>
</html>
